name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # every translation must have all strings of Strings.resx, otherwise menu entries show in English
      - name: Check translations
        shell: bash
        run: |
          python - XB1ControllerBatteryIndicator/XB1ControllerBatteryIndicator/Localization <<'EOF'
          import glob, os, sys, xml.etree.ElementTree as ET
          names = lambda path: {data.get("name") for data in ET.parse(path).getroot().iter("data")}
          english = names(os.path.join(sys.argv[1], "Strings.resx"))
          failed = False
          for path in sorted(glob.glob(os.path.join(sys.argv[1], "Strings.*.resx"))):
              missing = sorted(english - names(path))
              if missing:
                  print(f"::error file={path}::missing {', '.join(missing)}")
                  failed = True
          sys.exit(failed)
          EOF

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish XB1ControllerBatteryIndicator/XB1ControllerBatteryIndicator/XB1ControllerBatteryIndicator.csproj
          -c Release -r win-x64 --self-contained false
          -p:DebugType=none -p:RestoreLockedMode=true
          -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904
          -o publish

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: XB1ControllerBatteryIndicator
          path: publish/XB1ControllerBatteryIndicator.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # signing and storing the build provenance attestation
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: XB1ControllerBatteryIndicator

      # verify a download with: gh attestation verify XB1ControllerBatteryIndicator.exe --repo <owner>/<repo>
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: XB1ControllerBatteryIndicator.exe

      - name: Checksum
        run: sha256sum XB1ControllerBatteryIndicator.exe > XB1ControllerBatteryIndicator.exe.sha256

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" XB1ControllerBatteryIndicator.exe XB1ControllerBatteryIndicator.exe.sha256
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
